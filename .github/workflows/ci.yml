name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per ref. PRs: a new push cancels the old run on that branch. Main: a running run
  # always finishes, and GitHub keeps only the newest pending run, so the latest commit is always
  # tested without a queue of dozens of runs (#587, #634).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  JUST_VERSION: 1.59.0
  # PRs: scan the PR's commits. Pushes to main: scan the pushed commits.
  CI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  # Linux, nothing platform-specific (owner, 2026-11-18). Two parallel jobs; `ci` sums them up.
  # Repo-wide checks plus React and TypeScript: gitleaks, guards, biome, tsc and vitest.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only PRs skip the toolchain, the installs and ./scripts/ci.sh, but this job still runs
      # and passes, so the `ci` summary passes (branch protection requires the `ci` context). Do not use workflow-level
      # `paths:` or `paths-ignore:`: a skipped workflow leaves the required check pending forever.
      # Fails closed: pushes, an empty diff or a failed diff all run everything.
      - name: Decide whether this PR only changes docs
        id: scope
        run: ./scripts/docs-only.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install just
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "${JUST_VERSION}" -R casey/just -p "${archive}" -p SHA256SUMS --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" SHA256SUMS | sha256sum -c -
          tar -xzf "${archive}" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just --version

      - name: Install gitleaks
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks -p "${archive}" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run checks
        if: steps.scope.outputs.docs_only != 'true'
        run: just ci-shared ci-web

      # On the docs-only path `just ci` does not run, so run its gitleaks command directly.
      - name: Scan for secrets (docs-only PR)
        if: steps.scope.outputs.docs_only == 'true'
        run: gitleaks git --no-banner --redact --log-opts="${CI_BASE_REF}..HEAD"

  # Rust: rustfmt, the dependency boundaries, clippy, cargo test and the committed bindings.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only PRs skip the toolchain, the installs and ./scripts/ci.sh, but this job still runs
      # and passes, so the `ci` summary passes (branch protection requires the `ci` context). Do not use workflow-level
      # `paths:` or `paths-ignore:`: a skipped workflow leaves the required check pending forever.
      # Fails closed: pushes, an empty diff or a failed diff all run everything.
      - name: Decide whether this PR only changes docs
        id: scope
        run: ./scripts/docs-only.sh

      # The Tauri app crate links WebKitGTK on Linux (the same list as scripts/cloud-setup.sh).
      - name: Install the Tauri Linux libraries
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            libxdo-dev pkg-config build-essential file

      - name: Install Rust toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.docs_only != 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.docs_only != 'true'

      - name: Install just
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "${JUST_VERSION}" -R casey/just -p "${archive}" -p SHA256SUMS --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" SHA256SUMS | sha256sum -c -
          tar -xzf "${archive}" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just --version

      - name: Run checks
        if: steps.scope.outputs.docs_only != 'true'
        run: just ci-rust

  # Required check: branch protection expects the context `ci`, so keep this id and name.
  # `if: always()` is required: never `!cancelled()` or no `if`, because a skipped required job
  # counts as passing.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [web, rust]
    if: always()
    steps:
      - name: Require web and rust
        env:
          WEB: ${{ needs.web.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "web: ${WEB}"
          echo "rust: ${RUST}"
          [ "${WEB}" = success ] && [ "${RUST}" = success ]

  # Advisory: not a required check. A red result is the signal; no continue-on-error.
  # Off until the repo variable WINDOWS_CI is "true" (owner, 2026-11-18): gh variable set WINDOWS_CI --body true
  windows:
    name: windows (advisory)
    if: vars.WINDOWS_CI == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Mirrors the web and rust jobs: docs-only PRs skip the toolchain, the installs and ./scripts/ci.sh.
      # This job is advisory, so nothing requires it; it still reports a result either way.
      - name: Decide whether this PR only changes docs
        id: scope
        run: ./scripts/docs-only.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.docs_only != 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.docs_only != 'true'

      - name: Install just
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          archive="just-${JUST_VERSION}-x86_64-pc-windows-msvc.zip"
          for attempt in 1 2 3 4 5; do
            gh release download "${JUST_VERSION}" -R casey/just -p "${archive}" -p SHA256SUMS --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" SHA256SUMS | sha256sum -c -
          unzip -o "${archive}" just.exe
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just.exe --version

      - name: Install gitleaks
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
          for attempt in 1 2 3 4 5; do
            gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks -p "${archive}" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          unzip -o "${archive}" gitleaks.exe
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks.exe version

      - name: Run checks
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/ci.sh

      # On the docs-only path `just ci` does not run, so run its gitleaks command directly.
      - name: Scan for secrets (docs-only PR)
        if: steps.scope.outputs.docs_only == 'true'
        run: gitleaks git --no-banner --redact --log-opts="${CI_BASE_REF}..HEAD"
