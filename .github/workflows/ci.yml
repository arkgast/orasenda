name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  JUST_VERSION: 1.59.0
  # PRs: scan the PR's commits. Pushes to main: scan the pushed commits.
  CI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  # Required check: branch protection expects the context `ci`, so keep this id and name
  # and no matrix.
  ci:
    name: ci
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install just
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          base="https://github.com/casey/just/releases/download/${JUST_VERSION}"
          archive="just-${JUST_VERSION}-aarch64-apple-darwin.tar.gz"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/${archive}"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/SHA256SUMS"
          grep " ${archive}\$" SHA256SUMS | shasum -a 256 -c -
          tar -xzf "${archive}" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just --version

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/${archive}"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | shasum -a 256 -c -
          tar -xzf "${archive}" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run checks
        run: ./scripts/ci.sh

  # Advisory: not a required check. A red result is the signal; no continue-on-error.
  windows:
    name: windows (advisory)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install just
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          base="https://github.com/casey/just/releases/download/${JUST_VERSION}"
          archive="just-${JUST_VERSION}-x86_64-pc-windows-msvc.zip"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/${archive}"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/SHA256SUMS"
          grep " ${archive}\$" SHA256SUMS | sha256sum -c -
          unzip -o "${archive}" just.exe
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just.exe --version

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/${archive}"
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 20 "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          unzip -o "${archive}" gitleaks.exe
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks.exe version

      - name: Run checks
        run: ./scripts/ci.sh
