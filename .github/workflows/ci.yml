name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  JUST_VERSION: 1.59.0
  # PRs: scan the PR's commits. Pushes to main: scan the pushed commits.
  CI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  # Required check: branch protection expects the context `ci`, so keep this id and name
  # and no matrix.
  ci:
    name: ci
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only PRs skip the toolchain, the installs and ./scripts/ci.sh, but this job still runs
      # and passes, because branch protection requires the `ci` context. Do not use workflow-level
      # `paths:` or `paths-ignore:`: a skipped workflow leaves the required check pending forever.
      # Fails closed: pushes, an empty diff or a failed diff all run everything.
      - name: Decide whether this PR only changes docs
        id: scope
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if files="$(git diff --name-only "$CI_BASE_REF"...HEAD)" && [ -n "$files" ]; then
              echo "Changed files:"
              echo "$files"
              docs_only=true
              while IFS= read -r file; do
                case "$file" in
                  docs/* | *.md) ;;
                  *) docs_only=false ;;
                esac
              done <<<"$files"
            else
              echo "No changed files found, or the diff failed: running every check."
            fi
          else
            echo "Not a pull request: running every check."
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.docs_only != 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.docs_only != 'true'

      - name: Install just
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          archive="just-${JUST_VERSION}-aarch64-apple-darwin.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "${JUST_VERSION}" -R casey/just -p "${archive}" -p SHA256SUMS --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" SHA256SUMS | shasum -a 256 -c -
          tar -xzf "${archive}" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just --version

      - name: Install gitleaks
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks -p "${archive}" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | shasum -a 256 -c -
          tar -xzf "${archive}" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run checks
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/ci.sh

      # On the docs-only path `just ci` does not run, so run its gitleaks command directly.
      - name: Scan for secrets (docs-only PR)
        if: steps.scope.outputs.docs_only == 'true'
        run: gitleaks git --no-banner --redact --log-opts="${CI_BASE_REF}..HEAD"

  # Advisory: not a required check. A red result is the signal; no continue-on-error.
  windows:
    name: windows (advisory)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only PRs skip the toolchain, the installs and ./scripts/ci.sh, but this job still runs
      # and passes, because branch protection requires the `ci` context. Do not use workflow-level
      # `paths:` or `paths-ignore:`: a skipped workflow leaves the required check pending forever.
      # Fails closed: pushes, an empty diff or a failed diff all run everything.
      - name: Decide whether this PR only changes docs
        id: scope
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if files="$(git diff --name-only "$CI_BASE_REF"...HEAD)" && [ -n "$files" ]; then
              echo "Changed files:"
              echo "$files"
              docs_only=true
              while IFS= read -r file; do
                case "$file" in
                  docs/* | *.md) ;;
                  *) docs_only=false ;;
                esac
              done <<<"$files"
            else
              echo "No changed files found, or the diff failed: running every check."
            fi
          else
            echo "Not a pull request: running every check."
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.docs_only != 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.docs_only != 'true'

      - name: Install just
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/just"
          cd "$RUNNER_TEMP/just"
          archive="just-${JUST_VERSION}-x86_64-pc-windows-msvc.zip"
          for attempt in 1 2 3 4 5; do
            gh release download "${JUST_VERSION}" -R casey/just -p "${archive}" -p SHA256SUMS --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" SHA256SUMS | sha256sum -c -
          unzip -o "${archive}" just.exe
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          ./just.exe --version

      - name: Install gitleaks
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
          for attempt in 1 2 3 4 5; do
            gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks -p "${archive}" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download attempt $attempt failed" >&2
            sleep 15
          done
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          unzip -o "${archive}" gitleaks.exe
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks.exe version

      - name: Run checks
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/ci.sh

      # On the docs-only path `just ci` does not run, so run its gitleaks command directly.
      - name: Scan for secrets (docs-only PR)
        if: steps.scope.outputs.docs_only == 'true'
        run: gitleaks git --no-banner --redact --log-opts="${CI_BASE_REF}..HEAD"
