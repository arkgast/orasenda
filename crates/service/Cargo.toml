[package]
name = "orasenda-service"
description = "Orasenda session service: the API types, the session and the scheduler's publish logic, free of Tauri and OS APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The recording fakes (host, notifier, keep-awake) for the app crate's tests. Enable it only
# from [dev-dependencies], never from [dependencies].
test-support = ["orasenda-store/test-hooks"]

[dependencies]
orasenda-core = { path = "../core" }
orasenda-store = { path = "../store" }
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
uuid.workspace = true

[dev-dependencies]
orasenda-store = { path = "../store", features = ["test-hooks"] }
serde_json.workspace = true
