[package]
name = "orasenda-platform-macos"
description = "macOS implementations of the orasenda-core platform traits (empty on other targets)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
orasenda-core = { path = "../core" }
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSBundle", "NSDate", "NSDateFormatter", "NSDictionary", "NSEnumerator", "NSError", "NSFormatter", "NSLocale", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "NSTimeZone", "NSValue", "NSURL", "NSUserDefaults", "block2"] }
objc2-app-kit = { workspace = true, features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSApplication", "NSButton", "NSControl", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSEvent", "NSGraphics", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "block2", "libc", "objc2-core-foundation"] }
objc2-core-graphics = { workspace = true, features = ["CGEventSource", "CGEventTypes"] }
objc2-user-notifications = { workspace = true, features = ["UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }
block2.workspace = true

# AppKit status items need the main thread, which libtest never gives a test.
[[test]]
name = "status_item"
harness = false

# Null-window refusals run after the main-thread check, so they need the main thread too.
[[test]]
name = "windows_main_thread"
harness = false

# A panel's class swap against real KVO observers needs a real window, so the main thread.
[[test]]
name = "panel_kvo"
harness = false
