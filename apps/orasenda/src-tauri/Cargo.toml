[package]
name = "orasenda"
description = "Orasenda app shell: Tauri glue around orasenda-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orasenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
orasenda-core = { path = "../../../crates/core" }
orasenda-service = { path = "../../../crates/service" }
orasenda-store = { path = "../../../crates/store" }
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-specta.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
orasenda-platform-macos = { path = "../../../crates/platform-macos" }

[dev-dependencies]
orasenda-service = { path = "../../../crates/service", features = ["test-support"] }
orasenda-store = { path = "../../../crates/store", features = ["test-hooks"] }
serde_json.workspace = true
