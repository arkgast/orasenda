[workspace]
resolver = "3"
members = ["crates/*", "apps/orasenda/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri = "2.12.5"
tauri-build = "2.7.4"
# tauri-specta pins specta and specta-typescript exactly (ADR-007).
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
# objc2 family: macOS-only, matched to the versions Tauri 2.12.5 pulls. Members enable class features.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
# SQLite for crates/store only (ADR-002); bundled so iOS and Android build it from source.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
