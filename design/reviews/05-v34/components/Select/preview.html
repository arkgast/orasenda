<!-- @dsCard group="Fields" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div class="os-col" style="max-width: var(--field-width)">
  <div class="os-field">
    <label for="sel-add">Add as</label>
    <span class="os-select-wrap"><select class="os-select" id="sel-add"><option>Distracting</option><option>Always allowed</option><option>Focus</option><option>Neutral</option></select><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></span>
  </div>
  <div class="os-field">
    <label class="os-sr-only" for="sel-col">Column</label>
    <span class="os-select-wrap"><select class="os-select os-select-title" id="sel-col"><option>Doing</option><option>Today</option><option>Inbox</option><option>Backlog</option><option>Done</option></select><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></span>
  </div>
  <p class="os-muted">The second is a compact page picker: its value is the page title, so its label is visually hidden.</p>
</div>
</body>
</html>
