<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextArea</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var b = React.useState('Draft the opening argument for chapter 3.'), value = b[0], setValue = b[1];
    return h('div', { className: 'os-col', style: { maxWidth: 'var(--panel-width)' } },
      h(O.TextArea, { label: 'Task notes', value: value, onChange: function (e) { setValue(e.target.value); }, helper: 'Keep only what helps you start. Notes stay on this device.' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
