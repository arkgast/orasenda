<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>HabitDots</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    return h('div', { className: 'os-col' },
      h(O.HabitDots, { name: 'Walk outside', days: [{ state: 'done', label: 'Monday' }, { state: 'rest', label: 'Tuesday' }, { state: 'skipped', label: 'Wednesday' }, { state: 'skipped', label: 'Thursday' }, { state: 'done', today: true, label: 'Friday' }, { state: 'future', label: 'Saturday' }, { state: 'future', label: 'Sunday' }], legend: true, restartNote: 'Two days off. Today is a fresh start.', note: 'A short walk counts.' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
