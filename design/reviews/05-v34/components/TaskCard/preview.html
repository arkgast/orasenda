<!-- @dsCard group="Tasks" height=320 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TaskCard</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    function ack(what) { return function () { setNotice(what); }; }
    return h('div', { className: 'os-col' },
      h('div', { className: 'os-row', style: { padding: 0, alignItems: 'stretch' } },
        h('div', { style: { width: 'var(--column-width)' } }, h(O.TaskCard, { title: 'Draft chapter 3: organise the opening argument, evidence and next questions', estimate: 3, done: 1, tracked: '0h 25m', project: 'Writing', frog: true, active: true, onOpen: ack('Opened the chapter 3 task.') })),
        h('div', { style: { width: 'var(--column-width)' } }, h(O.TaskCard, { title: 'Review the interview notes', estimate: 1, done: 2, tracked: '0h 41m', selected: true, onOpen: ack('Opened the interview task.') })),
        h('div', { style: { width: 'var(--column-width)' } }, h(O.TaskCard, { title: 'Ask Maya about the schedule', type: 'shallow' }))),
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
