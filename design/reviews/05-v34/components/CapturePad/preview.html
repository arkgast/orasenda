<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CapturePad</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    function ack(what) { return function () { setNotice(what); }; }
    var a = React.useState(false), open = a[0], setOpen = a[1];
    var b = React.useState('Remember to reply to Maya about the schedule.'), value = b[0], setValue = b[1];
    var c = React.useState('internal'), kind = c[0], setKind = c[1];
    function close() { setOpen(false); }
    return h('div', { className: 'os-col' },
      h('p', null, 'A thought that is not the task can wait in the Inbox.'),
      h('div', null, h(O.Button, { onClick: function () { setOpen(true); } }, 'Capture a thought')),
      open ? h(O.CapturePad, { value: value, kind: kind, onChange: setValue, onKindChange: setKind, onSave: function (note) { setNotice('Saved to Inbox · ' + note.kind + ' interruption.'); return Promise.resolve(); }, onClose: close }) : null,
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
