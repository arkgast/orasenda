<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ModeChip</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    return h('div', { className: 'os-row' },
      ['focus', 'break', 'routine', 'warning', 'shallow', 'paused', 'idle'].map(function (mode) { return h(O.ModeChip, { key: mode, mode: mode }); }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
