<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SessionSlot</title></head>
<body>
<div class="os-col">
  <div class="os-sessionslot">
    <span class="os-menubar" role="timer" aria-live="off" aria-label="Focus, 18 minutes 42 seconds remaining"><svg class="os-shape" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/></svg> 18:42</span>
    <button class="os-iconbtn" type="button" aria-label="Pause session" aria-keyshortcuts="Control+Alt+F"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5v11M12.5 4.5v11"/></svg></button>
  </div>
</div>
</body>
</html>
