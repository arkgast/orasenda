<!-- @dsCard group="Timer" height=1700 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TimerRing</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  var TASK = 'Draft chapter 3: organise the long opening argument and the notes for the research team';
  var MODES = [
    { mode: 'focus', remaining: '18:42', remainingLabel: '18 minutes 42 seconds', progress: 0.25, task: TASK },
    { mode: 'break', remaining: '04:10', remainingLabel: '4 minutes 10 seconds', progress: 0.17 },
    { mode: 'warning', remaining: '01:48', remainingLabel: '1 minute 48 seconds', progress: 0.93, task: 'Finish the thought' },
    { mode: 'paused', remaining: '12:16', remainingLabel: '12 minutes 16 seconds', progress: 0.51, task: 'Chapter 3 outline' },
    { mode: 'idle' }
  ];
  // Fluid boxes: the ring takes the shorter side, clamped to timer-min-size .. timer-full-size.
  var BOXES = [{ w: 160, h: 160 }, { w: 320, h: 240 }, { w: 600, h: 420 }];
  function Panel(props) {
    var theme = props.theme;
    var s = React.useState(false), late = s[0], setLate = s[1];
    return h('section', { 'data-theme': theme, 'aria-label': theme === 'light' ? 'Light theme' : 'Dark theme', className: 'os-col', style: { background: 'var(--surface)', color: 'var(--ink)' } },
      h('p', { className: 'os-caption', style: { margin: 0 } }, theme === 'light' ? 'Light' : 'Dark'),
      h('div', { className: 'os-row', style: { padding: 0, alignItems: 'flex-start' } }, MODES.map(function (m) {
        return h(O.TimerRing, Object.assign({ key: m.mode, size: 200 }, m));
      })),
      h('p', { className: 'os-muted', style: { margin: 0 } }, 'Numeric size 200 in every mode: focus with a task clamped to two lines (whole in the name), break, warning, paused and idle. The chip carries the word and the shape.'),
      h('div', { className: 'os-actions', style: { alignItems: 'center' } },
        h(O.TimerRing, { size: 200, mode: late ? 'warning' : 'focus', remaining: late ? '01:59' : '02:01', remainingLabel: late ? '1 minute 59 seconds' : '2 minutes 1 second', progress: late ? 0.92 : 0.91, task: 'Finish the thought' }),
        h(O.Button, { onClick: function () { setLate(!late); } }, late ? 'Back to focus' : 'Two minutes left')),
      h('p', { className: 'os-muted', style: { margin: 0 } }, 'The arc and chip colour fade into amber over duration-slow; the word and the triangle switch at once. Instant under reduced motion.'),
      h('div', { className: 'os-row', style: { padding: 0, alignItems: 'flex-start' } }, BOXES.map(function (b) {
        return h('div', { key: b.w, className: 'os-stack', style: { gap: 'var(--space-1)' } },
          h('span', { className: 'os-caption' }, 'size="fluid" in ' + b.w + ' × ' + b.h),
          h('div', { style: { width: b.w, height: b.h, outline: '1px dashed var(--line-strong)' } },
            h(O.TimerRing, { size: 'fluid', remaining: '18:42', remainingLabel: '18 minutes 42 seconds', progress: 0.25, task: 'Chapter 3 outline', clock: b.w > 500 ? '09:41' : undefined })));
      })));
  }
  function Demo() {
    return h('div', null, h(Panel, { theme: 'light' }), h(Panel, { theme: 'dark' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
