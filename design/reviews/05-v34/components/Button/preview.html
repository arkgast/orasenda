<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    function ack(what) { return function () { setNotice(what); }; }
    return h('div', { className: 'os-col' },
      h('div', { className: 'os-actions' },
        h(O.Button, { variant: 'primary', size: 'lg', onClick: ack('Start focus pressed.') }, 'Start focus'),
        h(O.Button, { variant: 'break', onClick: ack('Take a break pressed.') }, 'Take a break'),
        h(O.Button, { onClick: ack('Add task pressed.') }, 'Add task'),
        h(O.Button, { variant: 'ghost', onClick: ack('Skip pressed.') }, 'Skip for now')),
      h('div', { className: 'os-actions' },
        h(O.Button, { variant: 'primary', disabled: true, 'aria-describedby': 'btn-why' }, 'Add apps'),
        h(O.Button, { variant: 'primary', loading: true }, 'Starting…'),
        h(O.Button, { variant: 'critical' }, 'Delete tracking data')),
      h('p', { id: 'btn-why', className: 'os-muted' }, 'Add apps is unavailable until you pick at least one app.'),
      h('p', { className: 'os-muted' }, 'Hover, press and Tab through the row. The critical variant appears only inside a delete-data Dialog.'),
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
