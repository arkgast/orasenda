<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MenuBarTimer</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    return h('div', { className: 'os-col' },
      h('div', { className: 'os-actions' },
        h(O.MenuBarTimer, { remaining: '18:42', remainingLabel: '18 minutes 42 seconds', progress: 0.25, task: 'Chapter 3 outline' }),
        h(O.MenuBarTimer, { remaining: '01:48', remainingLabel: '1 minute 48 seconds', mode: 'warning' }),
        h(O.MenuBarTimer, { remaining: '04:10', mode: 'break' }),
        h(O.MenuBarTimer, { remaining: '12:16', mode: 'paused' }),
        h(O.MenuBarTimer, { mode: 'idle' })),
      h(O.MenuBarTimer, { remaining: '18:42', remainingLabel: '18 minutes 42 seconds', progress: 0.25, compact: false, task: 'Chapter 3 outline' }),
      h('p', { className: 'os-muted' }, 'Compact inside SessionSlot; the longer form with the task belongs to FloatingTimer. The macOS menu-bar item itself is native.'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
