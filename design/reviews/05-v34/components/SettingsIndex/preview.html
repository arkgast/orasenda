<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SettingsIndex</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  var sections = [
    { id: 'general', name: 'General', value: 'Match system' },
    { id: 'timer', name: 'Timer', value: 'Classic · 25 / 5' },
    { id: 'notifications', name: 'Notifications', value: 'Off in macOS' },
    { id: 'keyboard', name: 'Keyboard', value: 'Set', problem: { text: 'Pick a new shortcut', alert: true } },
    { id: 'apps', name: 'Apps and sites', value: 'Not set up' },
    { id: 'about', name: 'About and data', value: 'On this Mac' }];
  function Demo() {
    var c = React.useState('timer');
    return h('div', { className: 'os-col' }, h(O.SettingsIndex, { sections: sections, current: c[0], onJump: c[1] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
