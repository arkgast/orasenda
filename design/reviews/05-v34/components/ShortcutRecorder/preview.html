<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ShortcutRecorder</title></head>
<body>
<div class="os-col">
  <p class="os-srow-label" id="rec-l">Start or pause focus from anywhere</p>
  <button class="os-recorder" type="button" id="rec-1" aria-labelledby="rec-l rec-1-k rec-1-h"><span class="os-recorder-keys" aria-hidden="true">⌃⌥F</span><span class="os-sr-only" id="rec-1-k">Control Option F</span><span class="os-recorder-hint" id="rec-1-h">Change</span></button>
  <button class="os-recorder os-recorder-recording" type="button" id="rec-2" aria-labelledby="rec-l rec-2-h"><span class="os-recorder-keys" aria-hidden="true">…</span><span class="os-recorder-hint" id="rec-2-h">Type the new keys, Esc cancels</span></button>
  <button class="os-recorder os-recorder-conflict" type="button" id="rec-3" aria-labelledby="rec-l rec-3-k rec-3-h" aria-describedby="rec-3-c"><span class="os-recorder-keys" aria-hidden="true">⌘K</span><span class="os-sr-only" id="rec-3-k">Command K</span><span class="os-recorder-hint" id="rec-3-h">Change</span></button>
  <p class="os-srow-status" id="rec-3-c"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.75"/><path d="M7 4v3.5"/><circle cx="7" cy="9.9" r="0.5" fill="currentColor"/></svg> Orasenda uses ⌘K for Commands. Pick a different one.</p>
</div>
</body>
</html>
