<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>KanbanColumn</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    function ack(what) { return function () { setNotice(what); }; }
    return h('div', { className: 'os-col' },
      h('div', { className: 'os-row', style: { padding: 0, alignItems: 'flex-start' } },
        h(O.KanbanColumn, { title: 'Doing', count: 1, limit: 1 }, h(O.TaskCard, { title: 'Chapter 3 outline', estimate: 3, done: 1, tracked: '0h 25m', active: true, onOpen: ack('Opened the chapter 3 task.') })),
        h(O.KanbanColumn, { title: 'Today', count: 4, limit: 3 }, h('p', { className: 'os-muted' }, 'Four tasks. One could move to tomorrow.')),
        h(O.KanbanColumn, { title: 'Inbox', count: 0 })),
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
