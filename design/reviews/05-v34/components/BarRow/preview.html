<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BarRow</title></head>
<body>
<div class="os-col" style="max-width: var(--panel-width)">
  <ul class="os-bars" aria-label="This week">
    <li class="os-bar-row os-bar-goal"><span class="os-bar-label"><svg class="os-shape" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/></svg> Focus</span><span class="os-bar"><span class="os-bar-fill" style="width: 18%"></span><span class="os-bar-tick" style="inset-inline-start: 100%" aria-hidden="true"></span></span><span class="os-bar-value">2h 10m</span><span class="os-bar-words">Goal 12h</span></li>
  </ul>
  <ul class="os-bars" aria-label="Apps this week">
    <li class="os-bar-row"><span class="os-bar-label">Xcode</span><span class="os-bar"><span class="os-bar-fill" style="width: 100%"></span></span><span class="os-bar-value">1h 50m</span></li>
    <li class="os-bar-row"><span class="os-bar-label">Safari</span><span class="os-bar"><span class="os-bar-fill" style="width: 32%"></span></span><span class="os-bar-value">0h 35m</span></li>
    <li class="os-bar-row"><span class="os-bar-label">Private apps</span><span class="os-bar"><span class="os-bar-fill" style="width: 14%"></span></span><span class="os-bar-value">0h 15m</span></li>
  </ul>
</div>
</body>
</html>
