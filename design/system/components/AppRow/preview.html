<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AppRow</title></head>
<body>
<div class="os-col" style="max-width: var(--content-width)">
  <ul class="os-applist" aria-label="Apps and sites">
    <li class="os-approw"><span class="os-approw-icon" style="background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line-strong)" aria-hidden="true"></span><span class="os-approw-name">Discord</span><span class="os-roletag"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5l5.5 5.5L7 12.5 1.5 7z"/></svg> Distracting</span><button class="os-iconbtn" type="button" aria-label="Change role for Discord" aria-haspopup="menu"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></button></li>
    <li class="os-approw"><span class="os-approw-icon" style="background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line-strong)" aria-hidden="true"></span><span class="os-approw-name">Xcode</span><span class="os-roletag os-roletag-focus"><svg class="os-glyph os-glyph-fill" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5"/></svg> Focus</span><button class="os-iconbtn" type="button" aria-label="Change role for Xcode" aria-haspopup="menu"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></button></li>
    <li class="os-approw"><svg class="os-approw-icon" viewBox="0 0 14 14" aria-hidden="true" style="fill:none;stroke:var(--ink-muted);stroke-width:1.2"><circle cx="7" cy="7" r="5.75"/><path d="M1.25 7h11.5M7 1.25c1.9 2.2 1.9 9.3 0 11.5M7 1.25c-1.9 2.2-1.9 9.3 0 11.5"/></svg><span class="os-approw-name">youtube.com<span class="os-approw-sub">Browser fallback until the extension is installed</span></span><span class="os-roletag"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5l5.5 5.5L7 12.5 1.5 7z"/></svg> Distracting</span><button class="os-iconbtn" type="button" aria-label="Change role for youtube.com" aria-haspopup="menu"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></button></li>
    <li class="os-approw"><span class="os-approw-icon" style="background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line-strong)" aria-hidden="true"></span><span class="os-approw-name">Orasenda</span><span class="os-roletag">Built in</span></li>
  </ul>
</div>

</html>
