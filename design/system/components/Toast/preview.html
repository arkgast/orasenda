<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var a = React.useState(false), open = a[0], setOpen = a[1];
    return h('div', { className: 'os-col' },
      h('p', null, 'A toast stays until you dismiss it.'),
      h('div', null, h(O.Button, { onClick: function () { setOpen(true); } }, 'Show the saved note')),
      open ? h(O.Toast, { onDismiss: function () { setOpen(false); } }, 'Thought saved to Inbox.') : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
