<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageFrame</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    return h('div', { className: 'os-col' },
      h('div', { style: { height: '320px', maxWidth: 'var(--content-width)', border: '1px solid var(--line)' } },
        h(O.PageFrame, { title: 'Shutdown', variant: 'flow', step: 'Step 2 of 4', status: h(O.InlineNotice, { variant: 'row', tone: 'rest' }, "Tomorrow's first task is set."),
          footer: [h(O.Button, { key: 'e', variant: 'ghost' }, 'End'), h(O.Button, { key: 'n', variant: 'ghost' }, 'Not now'), h(O.Button, { key: 'c', variant: 'primary' }, 'Continue')] },
          h(O.ScrollRegion, { label: 'Plan tomorrow' }, h('p', { style: { margin: 0 } }, 'Pick what comes first tomorrow. Everything else can wait in the Inbox.')))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
