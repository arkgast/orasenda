<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TimeBlock</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    function ack(what) { return function () { setNotice(what); }; }
    return h('div', { className: 'os-col' },
      h('div', { className: 'os-stack', style: { width: '260px' } },
        h(O.TimeBlock, { title: 'Chapter 3 outline', start: '08:30', end: '10:00', now: true, height: 90, onSelect: ack('Opened the Deep block.') }),
        h(O.NowLine, { time: '09:41' }),
        h(O.TimeBlock, { type: 'break', title: 'Walk outside', start: '10:00', end: '10:15', height: 30, onSelect: ack('Opened the Break block.') }),
        h(O.TimeBlock, { type: 'routine', title: 'Evening shutdown', start: '17:00', end: '17:15', height: 30, onSelect: ack('Opened the Routine block.') }),
        h(O.TimeBlock, { type: 'overflow', title: 'Room for what changes', start: '16:00', end: '17:00', height: 60, onSelect: ack('Opened the Overflow block.') })),
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
