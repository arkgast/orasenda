<!-- @dsCard group="Timer" height=1900 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TimerStrip</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  var INTENT = 'Draft chapter 3: organise the long opening argument and the notes for the research team';
  var STATES = [
    { mode: 'focus', remaining: '18:42', remainingLabel: '18 minutes 42 seconds', progress: 0.25 },
    { mode: 'break', remaining: '04:10', remainingLabel: '4 minutes 10 seconds', progress: 0.17 },
    { mode: 'warning', remaining: '01:48', remainingLabel: '1 minute 48 seconds', progress: 0.93 },
    { mode: 'paused', remaining: '12:16', remainingLabel: '12 minutes 16 seconds', progress: 0.51 },
    { mode: 'idle', idleLength: '25 min' }
  ];
  var ROWS = [[360, 240], [360, 360], [640, 330], [640, 480], [900, 240], [900, 600], [1000, 440], [1440, 900], [3440, 400]];
  function Frame(props) {
    return h('div', { className: 'os-stack', style: { gap: 'var(--space-1)', width: props.width, maxWidth: '100%' } },
      h('span', { className: 'os-caption' }, props.caption),
      h('div', { style: { padding: 'var(--space-3)', outline: '1px dashed var(--line-strong)' } }, props.children));
  }
  function Panel(props) {
    var theme = props.theme;
    var s = React.useState(false), late = s[0], setLate = s[1];
    return h('section', { 'data-theme': theme, 'aria-label': theme === 'light' ? 'Light theme' : 'Dark theme', className: 'os-col', style: { background: 'var(--surface)', color: 'var(--ink)' } },
      h('p', { className: 'os-caption', style: { margin: 0 } }, theme === 'light' ? 'Light' : 'Dark'),
      h('div', { className: 'os-row', style: { padding: 0, alignItems: 'flex-start' } }, STATES.map(function (st) {
        return h(Frame, { key: st.mode, width: 640, caption: 'strip, ' + st.mode + ', two-line intent' }, h(O.TimerStrip, Object.assign({ task: INTENT }, st)));
      })),
      h('div', { className: 'os-row', style: { padding: 0, alignItems: 'flex-start' } }, STATES.map(function (st) {
        return h(Frame, { key: st.mode, width: 360, caption: 'stacked, ' + st.mode }, h(O.TimerStrip, Object.assign({ stacked: true, task: INTENT }, st)));
      })),
      h('div', { className: 'os-actions' },
        h(Frame, { width: 640, caption: 'warning fade' }, h(O.TimerStrip, { mode: late ? 'warning' : 'focus', remaining: late ? '01:59' : '02:01', remainingLabel: late ? '1 minute 59 seconds' : '2 minutes 1 second', progress: late ? 0.92 : 0.91, task: 'Finish the thought' })),
        h(O.Button, { onClick: function () { setLate(!late); } }, late ? 'Back to focus' : 'Two minutes left')),
      h('p', { className: 'os-muted', style: { margin: 0 } }, 'The fill and chip colour fade over duration-slow; the triangle and the word switch at once.'));
  }
  function Rule() {
    return h('section', { className: 'os-col', 'aria-label': 'Choosing the layout' },
      h('p', { className: 'os-caption', style: { margin: 0 } }, 'timerLayout, live from the bundle'),
      h('table', { className: 'os-muted', style: { borderCollapse: 'collapse' } },
        h('thead', null, h('tr', null, ['Window', 'Today', 'Focus window box', 'Focus window'].map(function (t) { return h('th', { key: t, style: { textAlign: 'start', padding: 'var(--space-1) var(--space-3)' } }, t); }))),
        h('tbody', null, ROWS.map(function (r) {
          var m = r[0] < O.timerLayout.tokens['layout-compact-width'] ? 16 : 64, fw = r[0] - m, fh = r[1] - m;
          return h('tr', { key: r.join('x') },
            h('td', { className: 'os-num', style: { padding: 'var(--space-1) var(--space-3)' } }, r[0] + ' × ' + r[1]),
            h('td', { style: { padding: 'var(--space-1) var(--space-3)' } }, O.timerLayout({ contentWidth: r[0], contentHeight: r[1], windowWidth: r[0] })),
            h('td', { className: 'os-num', style: { padding: 'var(--space-1) var(--space-3)' } }, fw + ' × ' + fh),
            h('td', { style: { padding: 'var(--space-1) var(--space-3)' } }, O.timerLayout({ contentWidth: fw, contentHeight: fh, windowWidth: r[0] })));
        }))));
  }
  function Demo() {
    return h('div', null, h(Panel, { theme: 'light' }), h(Panel, { theme: 'dark' }), h(Rule));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
