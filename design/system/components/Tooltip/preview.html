<!-- @dsCard group="Overlays" height=200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tooltip</title></head>
<body>
<div class="os-col">
  <div class="os-actions" style="align-items: flex-start; gap: var(--space-6)">
    <div class="os-stack" style="align-items: center; gap: var(--space-1)">
      <button class="os-iconbtn os-iconbtn-round" type="button" aria-label="Pause session" aria-keyshortcuts="Space"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5v11M12.5 4.5v11"/></svg></button>
      <span class="os-tooltip" aria-hidden="true">Pause session <span class="os-kbd">Space</span></span>
    </div>
    <div class="os-stack" style="align-items: center; gap: var(--space-1)">
      <button class="os-btn os-btn-ghost" type="button">Classic · ends 15:20</button>
      <span class="os-tooltip" aria-hidden="true">Change preset <span class="os-kbd">P</span></span>
    </div>
    <div class="os-stack" style="align-items: center; gap: var(--space-1)">
      <button class="os-btn os-btn-ghost" type="button">Classic · ends 15:20</button>
      <span class="os-tooltip" aria-hidden="true">Change preset</span>
    </div>
  </div>
  <p class="os-muted">Single-key shortcuts on (first two) and off (last): the P key cap drops when the setting is off.</p>
</div>
</body>
</html>
