<!-- @dsCard group="Timer" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FloatingTimer</title></head>
<body>
<div class="os-col">
  <div class="os-floater" role="group" aria-label="Floating timer, Focus">
    <span class="os-floater-time" role="timer" aria-live="off" aria-label="Focus, 18 minutes 42 seconds remaining"><svg class="os-shape" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/></svg> 18:42</span>
    <button class="os-iconbtn" type="button" aria-label="Pause session"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5v11M12.5 4.5v11"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="Open Orasenda"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="M3 8h14"/></svg></button>
  </div>
  <div class="os-floater os-floater-warning" role="group" aria-label="Floating timer, Almost up">
    <span class="os-floater-time" role="timer" aria-live="off" aria-label="Almost up, 1 minute 48 seconds remaining"><svg class="os-shape" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.5l4.5 9h-9z"/></svg> 01:48 <span class="os-floater-word">Almost up</span></span>
    <button class="os-iconbtn" type="button" aria-label="Pause session"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5v11M12.5 4.5v11"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="Open Orasenda"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="M3 8h14"/></svg></button>
  </div>
  <div class="os-floater" role="group" aria-label="Floating timer, No session">
    <span class="os-floater-time"><svg class="os-shape" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg> <span class="os-floater-word">No session</span></span>
    <button class="os-btn os-btn-primary os-floater-start" type="button" aria-label="Start focus"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5l8 4.5-8 4.5z"/></svg> Start</button>
    <button class="os-iconbtn" type="button" aria-label="Open Orasenda"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="M3 8h14"/></svg></button>
  </div>
  <p class="os-muted">280 × 64 default. Closing lives in the context menu and the menu bar.</p>
</div>
</body>
</html>
