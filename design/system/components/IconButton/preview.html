<!-- @dsCard group="Actions" height=200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton</title></head>
<body>
<div class="os-col">
  <div class="os-actions">
    <button class="os-iconbtn os-iconbtn-round" type="button" aria-label="Pause session" aria-keyshortcuts="Space Control+Alt+F"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5v11M12.5 4.5v11"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="End session" aria-keyshortcuts="Meta+Period"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="Focus view" aria-haspopup="menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8V4h4M16 12v4h-4M4 4l5 5M16 16l-5-5"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="Pages" aria-haspopup="menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="Open Orasenda"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="M3 8h14"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
    <button class="os-iconbtn" type="button" aria-label="End session" aria-disabled="true" aria-describedby="ib-why"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg></button>
  </div>
  <p class="os-muted" id="ib-why">The last button is disabled: no session is running, so there is nothing to end.</p>
  <p class="os-muted">Round 52 × 52 for Pause/Resume on Today and in the Focus window; md 44 × 44 for the rest, including Pause inside SessionSlot and FloatingTimer. Each one's name is its tooltip text.</p>
</div>
</body>
</html>
