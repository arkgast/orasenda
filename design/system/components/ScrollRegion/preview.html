<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScrollRegion</title></head>
<body>
<div class="os-col">
  <div class="os-scroll" role="region" aria-label="Routines" data-scrolled="true" style="height: 168px; max-width: var(--panel-width); background: var(--surface)">
    <ul class="os-stack" style="list-style: none; margin: 0; padding: var(--space-2) var(--space-2) 0 0">
      <li>Morning start · 4 steps</li><li>Shutdown · 5 steps</li><li>Weekly review · 4 steps</li><li>Walk outside · 1 step</li><li>Read before bed · 1 step</li><li>Inbox to zero · 3 steps</li>
    </ul>
    <div class="os-scroll-more" aria-hidden="true"><svg class="os-glyph" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg> More below</div>
  </div>
  <p class="os-muted">Always-drawn bar, a hairline once scrolled, and "More below" while content remains.</p>
</div>
</body>
</html>
