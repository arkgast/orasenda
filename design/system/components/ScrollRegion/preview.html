<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScrollRegion</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var items = ['Morning start · 4 steps', 'Shutdown · 5 steps', 'Weekly review · 4 steps', 'Walk outside · 1 step', 'Read before bed · 1 step', 'Inbox to zero · 3 steps'];
    return h('div', { className: 'os-col' },
      h('div', { style: { height: '168px', maxWidth: 'var(--panel-width)', background: 'var(--surface)' } },
        h(O.ScrollRegion, { label: 'Routines' }, h('ul', { className: 'os-stack', style: { listStyle: 'none', margin: 0, padding: 0 } }, items.map(function (t) { return h('li', { key: t }, h('button', { type: 'button', className: 'os-btn os-btn-ghost' }, t)); })))),
      h('p', { className: 'os-muted' }, 'Always-drawn bar, a hairline once scrolled, and "More below" while content remains.'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
