<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NowLine</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    return h('div', { className: 'os-col' },
      h('p', { className: 'os-muted' }, 'Friday · Day view'),
      h(O.NowLine, { time: '09:41' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
