<!-- @dsCard group="Settings" height=520 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SettingsRow</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var c = React.useState(true);
    return h('div', { className: 'os-col', style: { maxWidth: 'var(--content-width)' } },
      h(O.SettingsRow, { label: 'Custom times', helper: 'Used when Custom is the preset. Focus is 5 to 180 minutes, break is 1 to 60.' },
        h(O.Input, { label: 'Focus minutes', helper: 'Between 5 and 180 minutes.', type: 'number', unit: 'min', defaultValue: 50 }),
        h(O.Input, { label: 'Break minutes', helper: 'Between 1 and 60 minutes.', type: 'number', unit: 'min', defaultValue: 90, error: 'Between 1 and 60 minutes. Still using 10.' })),
      h(O.SettingsRow, { label: 'Notifications', helper: 'Orasenda only notifies you when a session ends. Never about stats or streaks.', status: 'macOS has notifications off for Orasenda.', actionLabel: 'Open System Settings', actionName: 'Open System Settings, Notifications for Orasenda', onAction: function () {} },
        h('label', { className: 'os-choice' }, h('input', { type: 'checkbox', checked: c[0], onChange: function (e) { c[1](e.target.checked); } }), 'Tell me when a session ends')),
      h(O.SettingsRow, { label: 'Apps and sites', helper: 'Choose which apps count as focus or distraction.' }, h(O.EmptyState, { variant: 'inline', message: 'Nothing is recorded yet. Choosing which apps count as focus or distraction comes in a later update.' })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
