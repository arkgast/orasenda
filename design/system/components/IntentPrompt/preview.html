<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IntentPrompt</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    function ack(what) { return function () { setNotice(what); }; }
    var a = React.useState(false), open = a[0], setOpen = a[1];
    function close() { setOpen(false); }
    return h('div', { className: 'os-col' },
      h('p', null, 'You opened YouTube during a focus session.'),
      h('div', null, h(O.Button, { onClick: function () { setOpen(true); } }, 'Show the gentle pause')),
      open ? h(O.IntentPrompt, { app: 'YouTube', onReturn: close, onWait: function () { setNotice('Ten-minute wait started.'); close(); }, onContinue: function (reason) { setNotice('Continuing' + (reason ? ' · ' + reason : '') + '.'); close(); } }) : null,
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
