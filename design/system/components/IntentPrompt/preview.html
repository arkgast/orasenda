<!-- @dsCard group="Focus protection" height=560 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IntentPrompt</title></head>
<body>
<div id="root"></div>
<script>
  var O = window.Orasenda, h = React.createElement;
  // Preview only: open straight on step 2 by pressing "I need YouTube now" once the prompt is up.
  function OpenOnReasons() {
    React.useEffect(function () {
      var need = Array.prototype.find.call(document.querySelectorAll('dialog[open] button'), function (b) { return b.textContent.indexOf('I need') === 0; });
      if (need) need.click();
    }, []);
    return null;
  }
  function Demo() {
    var n = React.useState(''), notice = n[0], setNotice = n[1];
    var a = React.useState(null), open = a[0], setOpen = a[1];
    function close() { setOpen(null); }
    var withWait = open === 'wait' || open === 'reasons-wait';
    return h('div', { className: 'os-col' },
      h('p', null, 'You opened YouTube during a focus session.'),
      h('p', { className: 'os-muted' }, 'Step 1: the pause, with or without Wait.'),
      h('div', { className: 'os-actions' },
        h(O.Button, { onClick: function () { setOpen('wait'); } }, 'Show the gentle pause'),
        h(O.Button, { variant: 'ghost', onClick: function () { setOpen('nowait'); } }, 'Show it without Wait')),
      h('p', { className: 'os-muted' }, 'Step 2: the reason step that "I need YouTube now" opens.'),
      h('div', { className: 'os-actions' },
        h(O.Button, { onClick: function () { setOpen('reasons'); } }, 'Show the reason step'),
        h(O.Button, { variant: 'ghost', onClick: function () { setOpen('reasons-wait'); } }, 'Show it from the Wait variant')),
      open ? h(React.Fragment, null,
        h(O.IntentPrompt, { app: 'YouTube', onReturn: function () { setNotice('Back to focus.'); close(); },
          onWait: withWait ? function () { setNotice('Ten-minute wait started.'); close(); } : undefined,
          onContinue: function (reason) { setNotice('Continuing · ' + reason + '.'); close(); } }),
        open.indexOf('reasons') === 0 ? h(OpenOnReasons) : null) : null,
      notice ? h('p', { role: 'status', className: 'os-muted' }, notice) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
